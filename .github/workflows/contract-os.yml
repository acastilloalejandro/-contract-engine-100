name: contract-os

on:
  pull_request:
    paths:
      - "src/**"
      - "legal/**"
      - "tests/**"
      - ".github/workflows/contract-os.yml"
  push:
    branches:
      - main
      - "feat/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
