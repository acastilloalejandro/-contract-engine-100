name: Contract Engine CI
on:
  push:
    branches: [main, feat/spain-housing-rental-v6]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app/schema.js
      - run: node --check app/engine.js
      - run: node --check app/ui.js
      - run: node --check app/main.js
      - run: npm test
