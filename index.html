async function sha256(value) {
  if (!globalThis.crypto?.subtle) throw new Error('Web Crypto no disponible en este contexto.');
  const bytes = new TextEncoder().encode(String(value));
  const hash = await globalThis.crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(hash)].map(x => x.toString(16).padStart(2,'0')).join('');
}

async function sha256File(file) {
  if (!globalThis.crypto?.subtle) throw new Error('Web Crypto no disponible en este contexto.');
  const buffer = await file.arrayBuffer();
  const hash = await globalThis.crypto.subtle.digest('SHA-256', buffer);
  return [...new Uint8Array(hash)].map(x => x.toString(16).padStart(2,'0')).join('');
}

function formatSize(bytes=0) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024*1024) return `${(bytes/1024).toFixed(1)} KB`;
  return `${(bytes/1024/1024).toFixed(1)} MB`;
}

function isFilled(v) {
  return !(v === undefined || v === null || v === '' ||

}

function getCountry(code) {

/* ---------- Declarative rules ---------- */
function evaluateCondition(cond, data) {
  if (!cond) return true;

  if (cond.all) return cond.all.every(c => evaluateCondition(c, data));
  if (cond.any) return cond.any.some(c => evaluateCondition(c, data));
  if (cond.not) return !evaluateCondition(cond.not, data);

  const val = data[cond.field];

  switch (cond.operator) {
    case 'equals': return val === cond.value;
    case 'not_equals': return val !== cond.value;
    case 'not_empty': return isFilled(val);
    case 'empty': return !isFilled(val);
    case 'contains': return Array.isArray(val) ? val.includes(cond.value) : String(val||'').toLowerCase().includes(String(cond.value).toLowerCase());
    case 'gt': return Number(val) > Number(cond.value);
    case 'gte': return Number(val) >= Number(cond.value);
    case 'lt': return Number(val) < Number(cond.value);
    case 'lte': return Number(val) <= Number(cond.value);
    default: return true;
  }
}

const RulesEngine = {
  isVisible: (field, data) => evaluateCondition(field.visibility || field.dependsOn || null, data),
  isEnabled: (field, data) => field.enabled === undefined ? true : evaluateCondition(field.enabled, data),
  clean: (schema, data) => {
    const result = {};
    Object.keys(schema).forEach(k => {
      const def = schema[k];
      if (RulesEngine.isVisible(def, data)) result[k] = data[k];
    });
    return result;
  }
};

/* ---------- Normalization ---------- */
function normalizeData(raw) {
  const data = {...raw};

  ['workerFullName','employerFullName','position','dutiesDescription','ndaTerms'].forEach(k=>{
    if (typeof data[k] === 'string') data[k] = data[k].trim().replace(/\s+/g,' ');
  });

  if (data.workerPhone && typeof data.workerPhone === 'string') {
    data.workerPhone = data.workerPhone.replace(/[^\d+\s()-]/g,'').trim();
  }

  const country = getCountry(data.country);
  if (country) {
    data.systemCurrency = country.currency;
    data.systemLanguage = country.language;
    data.systemTimezone = country.timezone;
  }

  const workerCountry = getCountry(data.workerNationality);
  if (workerCountry) {
    data.workerCurrency = workerCountry.currency;
    data.workerLanguage = workerCountry.language;
    data.workerTimezone = workerCountry.timezone;
  }

  if (data.compensation === 'paid' && !data.currency && country) {
    data.currency = country.currency;
    data._derivedCurrency = true;
  }

  return data;
}

/* ---------- Validation ---------- */
function validateEmail(v) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||''));
}

function calculateAge(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (Number.isNaN(d.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - d.getFullYear();
  const m = today.getMonth() - d.getMonth();
  if (m < 0 || (m===0 && today.getDate() < d.getDate())) age--;
  return age;
}

function validate(schema, data, docs) {
  const errors = [];
  const warnings = [];

  Object.values(schema).forEach(field=>{
    if (!field.internalOnly && RulesEngine.isVisible(field,data)) {
      const v = data[field.id];
      const required = field.required === true;
      if (required && !isFilled(v) && field.type !== 'CHECKBOX') {
        errors.push({field:field.id, message:`"${field.label}" es obligatorio.`});
      }
      if (required && field.type === 'CHECKBOX' && v !== true) {
        errors.push({field:field.id, message:`Debe confirmar: ${field.label}`});
      }
      if (field.validation && isFilled(v)) {
        if (field.validation.minLength && String(v).length < field.validation.minLength)
          errors.push({field:field.id,message:`Mínimo ${field.validation.minLength} caracteres.`});
        if (field.validation.maxLength && String(v).length > field.validation.maxLength)
          errors.push({field:field.id,message:`Máximo ${field.validation.maxLength} caracteres.`});
        if (field.validation.min !== undefined && Number(v) < field.validation.min)
          errors.push({field:field.id,message:`El valor no puede ser inferior a ${field.validation.min}.`});
        if (field.validation.max !== undefined && Number(v) > field.validation.max)
          errors.push({field:field.id,message:`El valor no puede ser superior a ${field.validation.max}.`});
      }
      if (field.type === 'EMAIL' && isFilled(v) && !validateEmail(v))
        errors.push({field:field.id,message:'Introduzca un correo electrónico válido.'});
      if (field.id === 'workerDateOfBirth' && isFilled(v) && calculateAge(v) !== null && calculateAge(v) < 18)
        errors.push({field:field.id,message:'La persona debe cumplir la edad mínima aplicable.'});
      if (field.id === 'workerPassport' && isFilled(v) && v.verificationStatus === 'MISMATCH')
        errors.push({field:field.id,message:'Revise la discrepancia detectada en el documento.'});
      if (field.id === 'workerPassport' && isFilled(v) && v.expiryDate) {
        const expiry = new Date(v.expiryDate);
        if (expiry < new Date()) errors.push({field:field.id,message:'El pasaporte está caducado.'});
        else if ((expiry-new Date())/(1000*60*60*24) < 90)
          warnings.push({field:field.id,message:'El pasaporte caduca en menos de 90 días.'});
      }
    }
  });

  if (data.startDate && data.endDate && new Date(data.endDate) < new Date(data.startDate))
    errors.push({field:'endDate',message:'La fecha de finalización es anterior a la fecha de inicio.'});

  if (data.startTime && data.endTime && data.startTime === data.endTime)
    warnings.push({field:'endTime',message:'El horario de inicio y fin coincide. Revíselo.'});

  if (data.startTime && data.endTime && data.endTime < data.startTime)
    errors.push({field:'endTime',message:'La hora de finalización no puede ser anterior a la hora de inicio en esta versión del formulario.'});

  if (Array.isArray(data.workingDays) && data.weeklyRestDay && data.workingDays.includes(data.weeklyRestDay))
    errors.push({field:'weeklyRestDay',message:'El día de descanso semanal no debe figurar simultáneamente como día de trabajo.'});

  if (data.compensation === 'paid' && isFilled(data.salaryAmount) && Number(data.salaryAmount) <= 0)
    errors.push({field:'salaryAmount',message:'La remuneración debe ser superior a cero.'});

  if (data.compensation === 'paid' && !isFilled(data.currency))
    errors.push({field:'currency',message:'La moneda es obligatoria cuando existe remuneración.'});

  if (data.nda === true && !isFilled(data.ndaTerms))
    errors.push({field:'ndaTerms',message:'Debe definir el alcance de la confidencialidad.'});

  if (data.liveIn === true && !isFilled(data.accommodationDetails))
    errors.push({field:'accommodationDetails',message:'Debe completar los detalles del alojamiento.'});

  if (data.travelRequired === true && !isFilled(data.travelDetails))
    errors.push({field:'travelDetails',message:'Debe completar los detalles de los desplazamientos.'});

  if (docs.filter(Boolean).length === 0)
    warnings.push({field:'documents',message:'No existen documentos cargados en el expediente.'});

  return {errors,warnings,isValid:errors.length===0};
}

/* ---------- Document helpers ---------- */
function makeDocument(file, hash) {
  const id = generateId('DOC');
  const url = URL.createObjectURL(file);
  return {
    id,
    file,
    url,
    name:file.name,
    type:file.type || 'application/octet-stream',
    size:file.size,
    lastModified:file.lastModified,
    hash,
    version:1,
    createdAt:nowISO(),
    verificationStatus:'UPLOADED',
    extractionStatus:'NOT_RUN',
    extracted:{},
    expiryDate:''
  };
}

function documentKind(name,type) {
  const n = (name||'').toLowerCase();
  if (n.includes('passport') || n.includes('pasaporte')) return 'PASSPORT';
  if (/\b(identity|dni|national.?id|residence.?id)\b/.test(n)) return 'NATIONAL_ID';
  if (type?.startsWith('image/')) return 'IMAGE';
  if (type === 'application/pdf') return 'PDF';
  return 'DOCUMENT';
}

const DOCUMENT_FIELD_IDS = new Set(['workerPassport','workerNationalID','residenceDocument','additionalDocuments']);

function canonicalDataForHash(data) {
  const result = {};
  Object.entries(data || {}).forEach(([key,value]) => {
    if (DOCUMENT_FIELD_IDS.has(key) || key.endsWith('__prov')) return;
    if (key === '_derivedCurrency') return;
    result[key] = value;
  });
  return result;
}

/* ---------- Document Viewer ---------- */
function DocumentViewer({doc,onClose}) {
  const [zoom,setZoom] = useState(1);
  const [readText,setReadText] = useState('');
  const [readMode,setReadMode] = useState(false);

  useEffect(()=>{
    let cancelled=false;
    async function run(){
      if (!doc?.file) return;
      if (doc.type.startsWith('text/') || /\.txt$/i.test(doc.name)) {
        try {
          const text = await doc.file.text();
          if (!cancelled) setReadText(text.slice(0,30000));
        } catch {}
      }
    }
    run();
    return ()=>{cancelled=true};
  },[doc]);

  if (!doc) return null;

  const isImage = doc.type.startsWith('image/');
  const isPdf = doc.type === 'application/pdf' || /\.pdf$/i.test(doc.name);

  return (
    <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-xl flex items-center justify-center p-3 sm:p-6">
      <div className="w-full max-w-5xl h-[92vh] bg-white dark:bg-gray-950 rounded-3xl overflow-hidden flex flex-col shadow-2xl">
        <div className="px-4 py-3 border-b border-black/5 dark:border-white/10 flex items-center justify-between gap-3">
          <div className="min-w-0">
            <div className="font-semibold text-sm truncate">{doc.name}</div>
            <div className="text-[10px] text-gray-500 font-mono">{documentKind(doc.name,doc.type)} · {formatSize(doc.size)} · SHA-256 {doc.hash?.slice(0,12)}…</div>
          </div>
          <div className="flex items-center gap-2">
            {readText && <button className="tap px-3 rounded-xl bg-black/5 dark:bg-white/10 text-xs font-semibold" onClick={()=>setReadMode(v=>!v)}>{readMode?'Documento':'Leer texto'}</button>}
            <button className="tap rounded-xl bg-black/5 dark:bg-white/10 flex items-center justify-center" onClick={onClose}><Icon name="x"/></button>
          </div>
        </div>

        <div className="flex-1 overflow-auto bg-gray-100 dark:bg-black p-4">
          {readMode ? (
            <div className="max-w-3xl mx-auto bg-white dark:bg-gray-900 rounded-2xl p-6 shadow-sm">
              <div className="text-[10px] uppercase tracking-widest text-gray-400 mb-3">Modo lectura</div>
              <pre className="whitespace-pre-wrap text-sm leading-7 font-sans">{readText}</pre>

          ) : (

              <div className="bg-white dark:bg-gray-900 rounded-3xl p-8 text-center space-y-3 shadow">
                <div className="mx-auto w-16 h-16 rounded-2xl bg-blue-50 dark:bg-blue-950/30 text-apple-blue flex items-center justify-center"><Icon name="file" size={30}/></div>
                <div className="font-semibold">Previsualización del formato no disponible en este navegador</div>
                <p className="text-sm text-gray-500">El archivo sigue almacenado en la sesión y puede enviarse al visor nativo de una aplicación iOS.</p>
              </div>
            </div>

        {isImage && !readMode && (
          <div className="px-4 py-3 border-t border-black/5 dark:border-white/10 flex justify-center gap-2 safe-bottom">

/* ---------- Smart document field ---------- */
function DocumentField({field,value,onChange,onView,onExtract}) {
  const inputRef = useRef(null);
  const [dragging,setDragging] = useState(false);

  const accept = field.type === 'IMAGE' ? 'image/*' : '.pdf,.png,.jpg,.jpeg,.webp,.txt,.doc,.docx,.xls,.xlsx';
  const multiple = field.type === 'MULTI_FILE';
  const docs = multiple ? (Array.isArray(value)?value:[]) : (value?[value]:[]);

  const addFiles = async (list) => {
    const files = [...list].filter(Boolean);
    const processed = [];
    for (const file of files) {
      if (file.size > 15 * 1024 * 1024) continue;
      try {
        const hash = await sha256File(file);
        processed.push(makeDocument(file,hash));
      } catch {
        // Leave the current selection unchanged when Web Crypto is unavailable.
      }
    }
    if (processed.length) {
      window.__contractEngineRegisterDocs?.(processed);
    }
    if (multiple) onChange(field.id,[...docs,...processed]);
    else if (processed[0]) onChange(field.id,processed[0]);
  };

  const remove = (id) => {
    const target = docs.find(d=>d.id===id);
    if (target?.url) {
      try { URL.revokeObjectURL(target.url); } catch {}
    }
    if (multiple) onChange(field.id, docs.filter(d=>d.id!==id));
    else onChange(field.id,null);
  };

  return (
    <div className="space-y-3">
      <div
        className={`dropzone rounded-2xl border-2 border-dashed p-5 text-center transition ${dragging?'dragging':''}`}
        onDragEnter={e=>{e.preventDefault();setDragging(true)}}
        onDragOver={e=>e.preventDefault()}
        onDragLeave={()=>setDragging(false)}
        onDrop={e=>{e.preventDefault();setDragging(false);addFiles(e.dataTransfer.files)}}
        onClick={()=>inputRef.current?.click()}
      >
        <input
          ref={inputRef}
          hidden
          type="file"
          accept={accept}
          multiple={multiple}
          onChange={e=>addFiles(e.target.files)}
        />
        <div className="mx-auto w-14 h-14 rounded-2xl bg-blue-50 dark:bg-blue-950/30 text-apple-blue flex items-center justify-center mb-3">
          <Icon name="upload" size={26}/>
        </div>
        <div className="font-semibold text-sm">Añadir documento</div>
        <div className="text-xs text-gray-500 mt-1">Archivos · Cámara · Fotos · Escaneo</div>
        <button type="button" className="mt-3 px-4 py-2.5 rounded-xl bg-apple-blue text-white text-xs font-bold" onClick={e=>{e.stopPropagation();inputRef.current?.click()}}>
          Seleccionar archivo
        </button>
      </div>

      {docs.length>0 && (
        <div className="space-y-2">
          {docs.map(doc=>(
            <div key={doc.id} className="rounded-2xl border border-black/5 dark:border-white/10 p-3 bg-white/50 dark:bg-black/20">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-xl bg-gray-100 dark:bg-gray-800 overflow-hidden flex items-center justify-center shrink-0">
                  {doc.type.startsWith('image/') ? <img src={doc.url} alt={doc.name} className="w-full h-full object-cover" loading="lazy" /> : <Icon name="file" size={22} />}
                </div>
                <div className="min-w-0 flex-1">
                  <div className="font-semibold text-xs truncate">{doc.name}</div>
                  <div className="text-[10px] text-gray-500">{formatSize(doc.size)} · v{doc.version} · SHA-256 ✓</div>
                  <div className="mt-1 flex flex-wrap gap-1.5">
                    <Badge tone="blue">{documentKind(doc.name,doc.type)}</Badge>
                    {doc.verificationStatus==='VERIFIED' && <Badge tone="green">Verificado</Badge>}
                    {doc.expiryDate && <Badge tone="amber">Caducidad {doc.expiryDate}</Badge>}
                  </div>
                </div>
                <button className="tap px-3 rounded-xl bg-black/5 dark:bg-white/10 text-xs font-semibold" onClick={()=>onView(doc)}>Abrir</button>
              </div>

              {field.type === 'PASSPORT' && (
                <div className="mt-3 p-3 rounded-xl bg-blue-50/70 dark:bg-blue-950/20 text-xs space-y-2">
                  <div className="font-semibold text-apple-blue">Lectura inteligente</div>
                  <div className="text-gray-600 dark:text-gray-300">Extrae una propuesta de datos. Nada queda confirmado hasta que la persona lo revise.</div>
                  <div className="flex gap-2">
                    <button className="px-3 py-2 rounded-xl bg-apple-blue text-white text-[11px] font-semibold" onClick={()=>onExtract(doc)}>
                      Extraer campos
                    </button>
                    <button className="px-3 py-2 rounded-xl bg-white/80 dark:bg-white/10 text-[11px] font-semibold" onClick={()=>onView(doc)}>
                      Ver documento
                    </button>
                  </div>
                  {doc.extractionStatus === 'NEEDS_REVIEW' && (
                    <div className="mt-2 text-[11px]">
                      <div className="font-semibold mb-1">Propuesta detectada</div>
                      <div className="grid grid-cols-2 gap-2">
                        <span>Nombre: {doc.extracted.fullName || '—'}</span>
                        <span>Nacionalidad: {doc.extracted.nationality || '—'}</span>
                        <span>Fecha nacimiento: {doc.extracted.dateOfBirth || '—'}</span>
                        <span>Caducidad: {doc.extracted.expiryDate || '—'}</span>
                      </div>
                      <div className="flex gap-2 mt-2">
                        <button className="px-3 py-2 rounded-xl bg-green-600 text-white text-[11px] font-semibold" onClick={()=>onChange(field.id,{...doc,verificationStatus:'VERIFIED',extractionStatus:'VERIFIED'})}>
                          Confirmar extracción
                        </button>
                        <button className="px-3 py-2 rounded-xl bg-white dark:bg-gray-800 text-[11px] font-semibold border" onClick={()=>onChange(field.id,{...doc,verificationStatus:'NEEDS_REVIEW'})}>
                          Revisar manualmente
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              <div className="mt-3 flex items-center justify-between">
                <div className="text-[10px] text-gray-400 font-mono truncate max-w-[60%]">
                  {doc.hash}
                </div>
                <button className="text-[11px] font-semibold text-red-500" onClick={()=>remove(doc.id)}>Eliminar</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

    : field.type === 'DOCUMENT_READER' ? 'EXTRACTED'
