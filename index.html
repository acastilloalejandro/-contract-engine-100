  return v;
});

async function sha256(value) {
  const bytes = new TextEncoder().encode(value);
  const hash = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(hash)].map(x => x.toString(16).padStart(2,'0')).join('');
}

async function sha256File(file) {
  const buffer = await file.arrayBuffer();
  const hash = await crypto.subtle.digest('SHA-256', buffer);
  return [...new Uint8Array(hash)].map(x => x.toString(16).padStart(2,'0')).join('');
}

function formatSize(bytes=0) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024*1024) return `${(bytes/1024).toFixed(1)} KB`;
  return `${(bytes/1024/1024).toFixed(1)} MB`;
}

function isFilled(v) {
  return !(v === undefined || v === null || v === '' ||

}

function getCountry(code) {
  return COUNTRIES.find(c => c.value === code) || null;

/* ---------- Declarative rules ---------- */
function evaluateCondition(cond, data) {
  if (!cond) return true;

  if (cond.all) return cond.all.every(c => evaluateCondition(c, data));
  if (cond.any) return cond.any.some(c => evaluateCondition(c, data));
  if (cond.not) return !evaluateCondition(cond.not, data);

  const val = data[cond.field];

  switch (cond.operator) {
    case 'equals': return val === cond.value;
    case 'not_equals': return val !== cond.value;
    case 'not_empty': return isFilled(val);
    case 'empty': return !isFilled(val);
    case 'contains': return Array.isArray(val) ? val.includes(cond.value) : String(val||'').toLowerCase().includes(String(cond.value).toLowerCase());
    case 'gt': return Number(val) > Number(cond.value);
    case 'gte': return Number(val) >= Number(cond.value);
    case 'lt': return Number(val) < Number(cond.value);
    case 'lte': return Number(val) <= Number(cond.value);
    default: return true;
  }
}

const RulesEngine = {
  isVisible: (field, data) => evaluateCondition(field.visibility || field.dependsOn || null, data),
  isEnabled: (field, data) => field.enabled === undefined ? true : evaluateCondition(field.enabled, data),
  clean: (schema, data) => {
    const result = {};
    Object.keys(schema).forEach(k => {
      const def = schema[k];
      if (RulesEngine.isVisible(def, data)) result[k] = data[k];
    });
    return result;
  }
};

/* ---------- Normalization ---------- */
function normalizeData(raw) {
  const data = {...raw};

  ['workerFullName','employerFullName','position','dutiesDescription','ndaTerms'].forEach(k=>{
    if (typeof data[k] === 'string') data[k] = data[k].trim().replace(/\s+/g,' ');
  });

  if (data.workerPhone && typeof data.workerPhone === 'string') {
    data.workerPhone = data.workerPhone.replace(/[^\d+\s()-]/g,'').trim();
  }

  const country = getCountry(data.country);
  if (country) {
    data.systemCurrency = country.currency;
    data.systemLanguage = country.language;
    data.systemTimezone = country.timezone;
  }

  const workerCountry = getCountry(data.workerNationality);
  if (workerCountry) {
    data.workerCurrency = workerCountry.currency;
    data.workerLanguage = workerCountry.language;
    data.workerTimezone = workerCountry.timezone;
  }

  if (data.compensation === 'paid' && !data.currency && country) {
    data.currency = country.currency;
    data._derivedCurrency = true;
  }

  return data;
}

/* ---------- Validation ---------- */
function validateEmail(v) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||''));
}

function calculateAge(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (Number.isNaN(d.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - d.getFullYear();
  const m = today.getMonth() - d.getMonth();
  if (m < 0 || (m===0 && today.getDate() < d.getDate())) age--;
  return age;
}

function validate(schema, data, docs) {
  const errors = [];
  const warnings = [];

  Object.values(schema).forEach(field=>{
    if (!field.internalOnly && RulesEngine.isVisible(field,data)) {
      const v = data[field.id];
      const required = field.required === true;
      if (required && !isFilled(v) && field.type !== 'CHECKBOX') {
        errors.push({field:field.id, message:`"${field.label}" es obligatorio.`});
      }
      if (required && field.type === 'CHECKBOX' && v !== true) {
        errors.push({field:field.id, message:`Debe confirmar: ${field.label}`});
      }
      if (field.validation && isFilled(v)) {
        if (field.validation.minLength && String(v).length < field.validation.minLength)
          errors.push({field:field.id,message:`Mínimo ${field.validation.minLength} caracteres.`});
        if (field.validation.maxLength && String(v).length > field.validation.maxLength)
          errors.push({field:field.id,message:`Máximo ${field.validation.maxLength} caracteres.`});
        if (field.validation.min !== undefined && Number(v) < field.validation.min)
          errors.push({field:field.id,message:`El valor no puede ser inferior a ${field.validation.min}.`});
        if (field.validation.max !== undefined && Number(v) > field.validation.max)
          errors.push({field:field.id,message:`El valor no puede ser superior a ${field.validation.max}.`});
      }
      if (field.type === 'EMAIL' && isFilled(v) && !validateEmail(v))
        errors.push({field:field.id,message:'Introduzca un correo electrónico válido.'});
      if (field.id === 'workerDateOfBirth' && isFilled(v) && calculateAge(v) !== null && calculateAge(v) < 18)
        errors.push({field:field.id,message:'La persona debe cumplir la edad mínima aplicable.'});
      if (field.id === 'workerPassport' && isFilled(v) && v.verificationStatus === 'MISMATCH')
        errors.push({field:field.id,message:'Revise la discrepancia detectada en el documento.'});
      if (field.id === 'workerPassport' && isFilled(v) && v.expiryDate) {
        const expiry = new Date(v.expiryDate);
        if (expiry < new Date()) errors.push({field:field.id,message:'El pasaporte está caducado.'});
        else if ((expiry-new Date())/(1000*60*60*24) < 90)
          warnings.push({field:field.id,message:'El pasaporte caduca en menos de 90 días.'});
      }
    }
  });

  if (data.startDate && data.endDate && new Date(data.endDate) < new Date(data.startDate))
    errors.push({field:'endDate',message:'La fecha de finalización es anterior a la fecha de inicio.'});

  if (data.startTime && data.endTime && data.startTime === data.endTime)
    warnings.push({field:'endTime',message:'El horario de inicio y fin coincide. Revíselo.'});

  if (data.startTime && data.endTime && data.endTime < data.startTime)
    errors.push({field:'endTime',message:'La hora de finalización no puede ser anterior a la hora de inicio en esta versión del formulario.'});

  if (Array.isArray(data.workingDays) && data.weeklyRestDay && data.workingDays.includes(data.weeklyRestDay))
    errors.push({field:'weeklyRestDay',message:'El día de descanso semanal no debe figurar simultáneamente como día de trabajo.'});

  if (data.compensation === 'paid' && isFilled(data.salaryAmount) && Number(data.salaryAmount) <= 0)
    errors.push({field:'salaryAmount',message:'La remuneración debe ser superior a cero.'});

  if (data.compensation === 'paid' && !isFilled(data.currency))
    errors.push({field:'currency',message:'La moneda es obligatoria cuando existe remuneración.'});

  if (data.nda === true && !isFilled(data.ndaTerms))
    errors.push({field:'ndaTerms',message:'Debe definir el alcance de la confidencialidad.'});

  if (data.liveIn === true && !isFilled(data.accommodationDetails))
    errors.push({field:'accommodationDetails',message:'Debe completar los detalles del alojamiento.'});

  if (data.travelRequired === true && !isFilled(data.travelDetails))
    errors.push({field:'travelDetails',message:'Debe completar los detalles de los desplazamientos.'});

  if (docs.filter(Boolean).length === 0)
    warnings.push({field:'documents',message:'No existen documentos cargados en el expediente.'});

  return {errors,warnings,isValid:errors.length===0};
}

/* ---------- Document helpers ---------- */
function makeDocument(file, hash) {
  const id = generateId('DOC');
  const url = URL.createObjectURL(file);
  return {
    id,
    file,
    url,
    name:file.name,
    type:file.type || 'application/octet-stream',
    size:file.size,
    lastModified:file.lastModified,
    hash,
    version:1,
    createdAt:nowISO(),
    verificationStatus:'UPLOADED',
    extractionStatus:'NOT_RUN',
    extracted:{},
    expiryDate:''
  };
}

function documentKind(name,type) {
  const n = (name||'').toLowerCase();
  if (n.includes('passport') || n.includes('pasaporte')) return 'PASSPORT';
  if (n.includes('identity') || n.includes('dni') || n.includes('id')) return 'NATIONAL_ID';
  if (type?.startsWith('image/')) return 'IMAGE';
  if (type === 'application/pdf') return 'PDF';
  return 'DOCUMENT';
}

/* ---------- Document Viewer ---------- */
function DocumentViewer({doc,onClose}) {
  const [zoom,setZoom] = useState(1);
  const [readText,setReadText] = useState('');
  const [readMode,setReadMode] = useState(false);

  useEffect(()=>{
    let cancelled=false;
    async function run(){
      if (!doc?.file) return;
      if (doc.type.startsWith('text/') || /\.txt$/i.test(doc.name)) {
        try {
          const text = await doc.file.text();
          if (!cancelled) setReadText(text.slice(0,30000));
        } catch {}
      }
    }
    run();
    return ()=>{cancelled=true};
  },[doc]);

  if (!doc) return null;

  const isImage = doc.type.startsWith('image/');
  const isPdf = doc.type === 'application/pdf' || /\.pdf$/i.test(doc.name);

  return (
    <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-xl flex items-center justify-center p-3 sm:p-6">
      <div className="w-full max-w-5xl h-[92vh] bg-white dark:bg-gray-950 rounded-3xl overflow-hidden flex flex-col shadow-2xl">
        <div className="px-4 py-3 border-b border-black/5 dark:border-white/10 flex items-center justify-between gap-3">
          <div className="min-w-0">
            <div className="font-semibold text-sm truncate">{doc.name}</div>
            <div className="text-[10px] text-gray-500 font-mono">{documentKind(doc.name,doc.type)} · {formatSize(doc.size)} · SHA-256 {doc.hash?.slice(0,12)}…</div>
          </div>
          <div className="flex items-center gap-2">
            {readText && <button className="tap px-3 rounded-xl bg-black/5 dark:bg-white/10 text-xs font-semibold" onClick={()=>setReadMode(v=>!v)}>{readMode?'Documento':'Leer texto'}</button>}
            <button className="tap rounded-xl bg-black/5 dark:bg-white/10 flex items-center justify-center" onClick={onClose}><Icon name="x"/></button>
          </div>
        </div>

        <div className="flex-1 overflow-auto bg-gray-100 dark:bg-black p-4">
          {readMode ? (
            <div className="max-w-3xl mx-auto bg-white dark:bg-gray-900 rounded-2xl p-6 shadow-sm">
              <div className="text-[10px] uppercase tracking-widest text-gray-400 mb-3">Modo lectura</div>
              <pre className="whitespace-pre-wrap text-sm leading-7 font-sans">{readText}</pre>
            </div>
          ) : isImage ? (
            <div className="min-h-full flex items-center justify-center">
              <img src={doc.url} alt={doc.name} style={{transform:`scale(${zoom})`,maxHeight:'78vh'}} className="max-w-full object-contain rounded-xl shadow-lg transition-transform"/>
            </div>
          ) : isPdf ? (
            <iframe title={doc.name} src={doc.url} className="w-full h-full rounded-xl bg-white"/>
          ) : (
            <div className="max-w-xl mx-auto h-full flex items-center justify-center">
              <div className="bg-white dark:bg-gray-900 rounded-3xl p-8 text-center space-y-3 shadow">
                <div className="mx-auto w-16 h-16 rounded-2xl bg-blue-50 dark:bg-blue-950/30 text-apple-blue flex items-center justify-center"><Icon name="file" size={30}/></div>
                <div className="font-semibold">Previsualización del formato no disponible en este navegador</div>
                <p className="text-sm text-gray-500">El archivo sigue almacenado en la sesión y puede enviarse al visor nativo de una aplicación iOS.</p>
              </div>
            </div>
          )}
        </div>

        {isImage && !readMode && (
          <div className="px-4 py-3 border-t border-black/5 dark:border-white/10 flex justify-center gap-2 safe-bottom">
            <button className="tap px-4 rounded-xl bg-black/5 dark:bg-white/10" onClick={()=>setZoom(z=>Math.max(.6,z-.2))}><Icon name="minus"/></button>
            <div className="min-w-16 flex items-center justify-center font-mono text-xs">{Math.round(zoom*100)}%</div>
            <button className="tap px-4 rounded-xl bg-black/5 dark:bg-white/10" onClick={()=>setZoom(z=>Math.min(2.4,z+.2))}><Icon name="plus"/></button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- Smart document field ---------- */
function DocumentField({field,value,onChange,onView,onExtract}) {
  const inputRef = useRef(null);
  const [dragging,setDragging] = useState(false);

  const accept = field.type === 'IMAGE' ? 'image/*' : '.pdf,.png,.jpg,.jpeg,.webp,.txt,.doc,.docx,.xls,.xlsx';
  const multiple = field.type === 'MULTI_FILE';
  const docs = multiple ? (Array.isArray(value)?value:[]) : (value?[value]:[]);

  const addFiles = async (list) => {
    const files = [...list];
    const processed = [];
    for (const file of files) {
      if (file.size > 15 * 1024 * 1024) continue;
      const hash = await sha256File(file);
      processed.push(makeDocument(file,hash));
    }
    if (processed.length) {
      window.__contractEngineRegisterDocs?.(processed);
    }
    if (multiple) onChange(field.id,[...docs,...processed]);
    else if (processed[0]) onChange(field.id,processed[0]);
  };

  const remove = (id) => {
    if (multiple) onChange(field.id, docs.filter(d=>d.id!==id));
    else onChange(field.id,null);
  };

  return (
    <div className="space-y-3">
      <div
        className={`dropzone rounded-2xl border-2 border-dashed p-5 text-center transition ${dragging?'dragging':''}`}
        onDragEnter={e=>{e.preventDefault();setDragging(true)}}
        onDragOver={e=>e.preventDefault()}
        onDragLeave={()=>setDragging(false)}
        onDrop={e=>{e.preventDefault();setDragging(false);addFiles(e.dataTransfer.files)}}
        onClick={()=>inputRef.current?.click()}
      >
        <input
          ref={inputRef}
          hidden
          type="file"
          accept={accept}
          multiple={multiple}
          onChange={e=>addFiles(e.target.files)}
        />
        <div className="mx-auto w-14 h-14 rounded-2xl bg-blue-50 dark:bg-blue-950/30 text-apple-blue flex items-center justify-center mb-3">
          <Icon name="upload" size={26}/>
        </div>
        <div className="font-semibold text-sm">Añadir documento</div>
        <div className="text-xs text-gray-500 mt-1">Archivos · Cámara · Fotos · Escaneo</div>
        <button type="button" className="mt-3 px-4 py-2.5 rounded-xl bg-apple-blue text-white text-xs font-bold" onClick={e=>{e.stopPropagation();inputRef.current?.click()}}>
          Seleccionar archivo
        </button>
      </div>

      {docs.length>0 && (
        <div className="space-y-2">
          {docs.map(doc=>(
            <div key={doc.id} className="rounded-2xl border border-black/5 dark:border-white/10 p-3 bg-white/50 dark:bg-black/20">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-xl bg-gray-100 dark:bg-gray-800 overflow-hidden flex items-center justify-center shrink-0">
                  {doc.type.startsWith('image/') ? <img src={doc.url} className="w-full h-full object-cover" /> : <Icon name="file" size={22} />}
                </div>
                <div className="min-w-0 flex-1">
                  <div className="font-semibold text-xs truncate">{doc.name}</div>
                  <div className="text-[10px] text-gray-500">{formatSize(doc.size)} · v{doc.version} · SHA-256 ✓</div>
                  <div className="mt-1 flex flex-wrap gap-1.5">
                    <Badge tone="blue">{documentKind(doc.name,doc.type)}</Badge>
                    {doc.verificationStatus==='VERIFIED' && <Badge tone="green">Verificado</Badge>}
                    {doc.expiryDate && <Badge tone="amber">Caducidad {doc.expiryDate}</Badge>}
                  </div>
                </div>
                <button className="tap px-3 rounded-xl bg-black/5 dark:bg-white/10 text-xs font-semibold" onClick={()=>onView(doc)}>Abrir</button>
              </div>

              {field.type === 'PASSPORT' && (
                <div className="mt-3 p-3 rounded-xl bg-blue-50/70 dark:bg-blue-950/20 text-xs space-y-2">
                  <div className="font-semibold text-apple-blue">Lectura inteligente</div>
                  <div className="text-gray-600 dark:text-gray-300">Extrae una propuesta de datos. Nada queda confirmado hasta que la persona lo revise.</div>
                  <div className="flex gap-2">
                    <button className="px-3 py-2 rounded-xl bg-apple-blue text-white text-[11px] font-semibold" onClick={()=>onExtract(doc)}>
                      Extraer campos
                    </button>
                    <button className="px-3 py-2 rounded-xl bg-white/80 dark:bg-white/10 text-[11px] font-semibold" onClick={()=>onView(doc)}>
                      Ver documento
                    </button>
                  </div>
                  {doc.extractionStatus === 'NEEDS_REVIEW' && (
                    <div className="mt-2 text-[11px]">
                      <div className="font-semibold mb-1">Propuesta detectada</div>
                      <div className="grid grid-cols-2 gap-2">
                        <span>Nombre: {doc.extracted.fullName || '—'}</span>
                        <span>Nacionalidad: {doc.extracted.nationality || '—'}</span>
                        <span>Fecha nacimiento: {doc.extracted.dateOfBirth || '—'}</span>
                        <span>Caducidad: {doc.extracted.expiryDate || '—'}</span>
                      </div>
                      <div className="flex gap-2 mt-2">
                        <button className="px-3 py-2 rounded-xl bg-green-600 text-white text-[11px] font-semibold" onClick={()=>onChange(field.id,{...doc,verificationStatus:'VERIFIED',extractionStatus:'VERIFIED'})}>
                          Confirmar extracción
                        </button>
                        <button className="px-3 py-2 rounded-xl bg-white dark:bg-gray-800 text-[11px] font-semibold border" onClick={()=>onChange(field.id,{...doc,verificationStatus:'NEEDS_REVIEW'})}>
                          Revisar manualmente
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              <div className="mt-3 flex items-center justify-between">
                <div className="text-[10px] text-gray-400 font-mono truncate max-w-[60%]">
                  {doc.hash}
                </div>
                <button className="text-[11px] font-semibold text-red-500" onClick={()=>remove(doc.id)}>Eliminar</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------- Generic Smart Field ---------- */
function SmartField({field,value,onChange,error,warning,role,onViewDoc,onExtract,provenance,onExplain}) {
  const base = `field ${error?'invalid':''}`;
  const disabled = Array.isArray(field.actor) && !field.actor.includes(role) && role !== 'reviewer';
  const [showHelp,setShowHelp] = useState(false);
  const status = error ? 'INVALID'
    : warning ? 'WARNING'
    : value?.verificationStatus === 'VERIFIED' ? 'VERIFIED'
    : field.type === 'DERIVED' ? 'DERIVED'
    : field.type === 'DOCUMENT_READER' ? 'EXTRACTED'
    : isFilled(value) ? 'VALID' : null;

  const handle = e => {
    let v = e.target.value;
    if (['SWITCH','CHECKBOX'].includes(field.type)) v = e.target.checked;
    if (field.type === 'MULTI_SELECT') {
      v = [...e.target.selectedOptions].map(x=>x.value);
    }
    if (['INTEGER'].includes(field.type)) v = v===''?'':parseInt(v,10);
    if (['NUMBER','DECIMAL','CURRENCY','PERCENTAGE'].includes(field.type)) v = v===''?'':Number(v);
    onChange(field.id,v);
  };

  const optionList = field.options || [];
  const common = {
    className:`${base} ${disabled?'opacity-60 cursor-not-allowed':''}`,
    value: value ?? '',
    onChange:handle,
    disabled:disabled || field.type==='READONLY' || field.type==='DERIVED'
  };

  function render() {
    switch(field.type) {
      case 'TEXT':
      case 'PERSON_NAME':
      case 'CITY':
      case 'EMAIL':
      case 'PHONE':
      case 'URL':
      case 'ADDRESS':
      case 'RICH_TEXT':
        return field.type === 'RICH_TEXT' || field.type === 'ADDRESS'
          ? <textarea rows={field.type==='ADDRESS'?3:4} placeholder="Introducir información…" {...common}/>
          : <input type={field.type==='EMAIL'?'email':field.type==='URL'?'url':field.type==='PHONE'?'tel':'text'} placeholder="Introducir información…" {...common}/>;
      case 'TEXTAREA':
        return <textarea rows={4} placeholder="Escriba aquí…" {...common}/>;
      case 'DATE':
      case 'DATE_OF_BIRTH':
      case 'TIME':
      case 'DATETIME':
        return <input type={field.type==='DATE_OF_BIRTH'?'date':field.type==='DATE'?'date':field.type==='TIME'?'time':'datetime-local'} {...common}/>;
      case 'NUMBER':
      case 'INTEGER':
      case 'DECIMAL':
      case 'CURRENCY':
      case 'PERCENTAGE':
        return <input type="number" inputMode="decimal" step={field.type==='INTEGER'?'1':'0.01'} placeholder="0" {...common}/>;
      case 'COUNTRY':
      case 'SELECT':
      case 'SEARCH_SELECT':
      case 'LANGUAGE':
      case 'TIMEZONE':
        return <select {...common}><option value="">Seleccionar…</option>{optionList.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</select>;
      case 'MULTI_SELECT':
        return <select multiple className={`${base} min-h-36`} value={value||[]} onChange={handle} disabled={disabled}>{optionList.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</select>;
      case 'RADIO':
      case 'SEGMENTED_CONTROL':
        return <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">{optionList.map(o=><button type="button" key={o.value} disabled={disabled} onClick={()=>onChange(field.id,o.value)} className={`tap rounded-2xl px-4 py-3 text-sm border text-left ${value===o.value?'border-apple-blue bg-blue-50 dark:bg-blue-950/20 text-apple-blue':'border-black/10 dark:border-white/10 bg-white/40 dark:bg-black/20'}`}>{o.label}</button>)}</div>;
      case 'SWITCH':
        return <div className="flex items-center justify-between rounded-2xl bg-white/50 dark:bg-black/20 border border-black/5 dark:border-white/10 p-3.5"><div className="text-sm">{value?'Sí / activado':'No / desactivado'}</div><input type="checkbox" className="w-12 h-7 accent-apple-green" checked={!!value} onChange={handle} disabled={disabled}/></div>;
      case 'CHECKBOX':
      case 'READ_CONFIRMATION':
        return <label className="flex items-start gap-3 p-4 rounded-2xl border border-black/5 dark:border-white/10 bg-white/50 dark:bg-black/20"><input type="checkbox" className="mt-1 w-5 h-5 accent-apple-blue" checked={!!value} onChange={handle} disabled={disabled}/><span className="text-sm leading-6">{field.label}</span></label>;
      case 'DERIVED':
      case 'CALCULATED':
      case 'READONLY':
        return <div className="rounded-2xl p-4 bg-blue-50/60 dark:bg-blue-950/20 border border-blue-100 dark:border-blue-900/40 text-sm">{String(value||'Dato derivado por el sistema')}</div>;
      case 'PASSPORT':
      case 'NATIONAL_ID':
      case 'RESIDENCE_ID':
      case 'DOCUMENT':
      case 'MULTI_FILE':
      case 'IMAGE':
        return <DocumentField field={field} value={value} onChange={onChange} onView={onViewDoc} onExtract={onExtract}/>;
      case 'DOCUMENT_READER':
      case 'DOCUMENT_PREVIEW':
        return <DocumentField field={{...field,type:'DOCUMENT'}} value={value} onChange={onChange} onView={onViewDoc} onExtract={onExtract}/>;
      case 'PERSON':
      case 'ORGANIZATION':
        return <textarea rows={3} placeholder="Nombre, relación y datos de contacto…" {...common}/>;
      case 'TABLE':
      case 'MATRIX':
      case 'REPEATER':
      case 'GROUP':
      case 'CONDITIONAL_GROUP':
        return <textarea rows={4} placeholder="Introducir elementos, uno por línea…" {...common}/>;
      case 'SIGNATURE':
        return <div className="p-4 rounded-2xl border border-black/10 dark:border-white/10 text-xs text-gray-500">La firma se habilita después de revisión, consentimiento y autenticación.</div>;
      case 'BIOMETRIC_CONFIRMATION':
        return <button type="button" className="w-full p-4 rounded-2xl bg-black text-white dark:bg-white dark:text-black font-semibold" onClick={()=>onChange(field.id,true)}>Autenticar dispositivo</button>;
      case 'OTP':
        return <input {...common} inputMode="numeric" maxLength={8} placeholder="Código de un solo uso"/>;
      case 'SUMMARY':
        return <div className="p-4 rounded-2xl bg-gray-50 dark:bg-gray-900 text-sm">Resumen dinámico del bloque actual.</div>;
      default:
        return <input type="text" {...common}/>;
    }
  }

  return (
    <div className="space-y-2 animate-up">
      {field.type !== 'CHECKBOX' && field.type !== 'READ_CONFIRMATION' && (
        <div className="flex items-start justify-between gap-3">
          <div>
            <label className="text-sm font-semibold">{field.label} {field.required && <span className="text-apple-red">*</span>}</label>
            {field.description && <p className="text-xs text-gray-500 mt-1 leading-5">{field.description}</p>}
          </div>
          <div className="flex items-center gap-2 shrink-0">
            <FieldStatus status={status}/>
            {(field.description || provenance) && (
              <button className="text-gray-400" title="Explicar campo" onClick={()=>setShowHelp(v=>!v)}><Icon name="search" size={15}/></button>
            )}
          </div>
        </div>
      )}

      {render()}

      {showHelp && (
        <div className="rounded-2xl bg-gray-50 dark:bg-gray-900 p-3 text-xs text-gray-600 dark:text-gray-300">
          {provenance ? `Origen: ${provenance.sourceType || 'USER_INPUT'}.` : 'Este campo se adapta a las respuestas y dependencias del expediente.'}
        </div>
      )}

      {error && <div className="flex items-center gap-1.5 text-xs font-medium text-apple-red"><Icon name="alert" size={13}/>{error}</div>}
      {!error && warning && <div className="flex items-center gap-1.5 text-xs font-medium text-apple-amber"><Icon name="alert" size={13}/>{warning}</div>}
    </div>
  );
}

/* ---------- Verification ---------- */
const APP_BASE_URL = `${location.origin}${location.pathname.replace(/\/$/, '')}`;
const AUTH_MODE = 'static-demo';

function buildVerificationUrl(receipt) {
  const params = new URLSearchParams({
    id: receipt.recordId,
    version: String(receipt.version),
    hash: receipt.hash,
    signature: receipt.signatureId,
    mode: AUTH_MODE
  });
  return `${APP_BASE_URL}/verify.html?${params.toString()}`;
}

function VerificationQR({receipt}) {
  const ref = useRef(null);
  const [ready,setReady] = useState(false);
  const url = receipt?.verificationUrl || "";
  useEffect(()=>{
    if (!ref.current || !url) return;
    ref.current.innerHTML = "";
    if (window.QRCode) {
      new window.QRCode(ref.current,{
        text:url, width:220, height:220, quietZone:12,
        drawer:'canvas', correctLevel:window.QRCode.CorrectLevel?.H
      });
      setReady(true);
    } else {
      setReady(false);
    }
  },[url]);
  return <div>
    <div ref={ref} className="min-h-[220px] flex items-center justify-center rounded-2xl bg-white" aria-label="Código QR de verificación"/>
    {!ready && <div className="text-[11px] text-apple-amber mt-2">Generador QR no disponible en este navegador.</div>}
    {url && <button className="mt-3 text-apple-blue text-xs font-semibold" onClick={()=>navigator.clipboard?.writeText(url)}>Copiar enlace de verificación</button>}
  </div>;
}

/* ---------- Main app ---------- */
function App() {

    workerRole:'worker',
    country:'SA',
    city:'Jeddah',
    jurisdiction:'Jeddah, Saudi Arabia',
    compensation:'paid',
    currency:'SAR'
  });
  const [documents,setDocuments] = useState([]);
  const [view,setView] = useState('form');

  const [hash,setHash] = useState('');
  const [signatureReceipt,setSignatureReceipt] = useState(null);
  const [audit,setAudit] = useState([]);
  const [saveState,setSaveState] = useState('guardado');

  const [readSection,setReadSection] = useState(null);

  const addAudit = useCallback((action,meta={})=>{
    setAudit(prev=>[...prev,{
      eventId:generateId('EVT'),
      recordId:record.id,
      actor:role,
      timestamp:nowISO(),

      previousState:record.status,
      newState:record.status,
      hash:'',
      ...meta
    }]);
  },[role,record.id,record.status]);

  useEffect(() => {
    window.__contractEngineRegisterDocs = (incoming=[]) => {
      setDocuments(prev => {
        const existing = new Set(prev.map(d => d.id));
        return [...prev, ...incoming.filter(d => !existing.has(d.id))];
      });
      incoming.forEach(d => addAudit('documentAdded', {documentId:d.id, name:d.name, hash:d.hash}));
    };
    return () => { delete window.__contractEngineRegisterDocs; };
  }, [addAudit]);

  useEffect(()=>{
    document.documentElement.classList.toggle('dark',dark);
  },[dark]);

  const [record,setRecord] = useState({
    id:generateId('CR'),
    version:1,
    schemaVersion:'4.0.0',
    dataVersion:1,
    documentVersion:1,
    status:RECORD_STATES.DRAFT,

  const normalized = useMemo(()=>normalizeData(data),[data]);
  const attachedDocs = useMemo(() => [
    normalized.workerPassport,
    normalized.workerNationalID,
    normalized.residenceDocument,
    ...(Array.isArray(normalized.additionalDocuments) ? normalized.additionalDocuments : [])
  ].filter(Boolean), [normalized]);

  const visible = useMemo(()=>Object.values(SCHEMA).filter(f=>!f.internalOnly && RulesEngine.isVisible(f,normalized)),[normalized]);
  const validation = useMemo(()=>validate(SCHEMA,normalized,attachedDocs),[normalized,attachedDocs]);
  const required = useMemo(()=>visible.filter(f=>f.required),[visible]);
  const completed = useMemo(()=>required.filter(f=>isFilled(normalized[f.id]) || (f.type==='CHECKBOX' && normalized[f.id]===true)),[required,normalized]);
  const pct = required.length ? Math.round(completed.length/required.length*100) : 0;

  const grouped = useMemo(()=>{
    const map={};
    visible.forEach(f=>{
      if (!map[f.section]) map[f.section]=[];
      map[f.section].push(f);
    });
    return map;
  },[visible]);

  const errorMap = useMemo(()=>{
    const m={};
    validation.errors.forEach(e=>m[e.field]=e.message);
    return m;
  },[validation.errors]);

  const warningMap = useMemo(()=>{
    const m={};
    validation.warnings.forEach(e=>m[e.field]=e.message);
    return m;
  },[validation.warnings]);

  const localDraft = useMemo(()=>{
    const safeData = {};
    Object.entries(normalized).forEach(([key,value])=>{
      const def = SCHEMA[key];
      if (def?.sensitivity === 'restricted' || def?.sensitivity === 'personal') return;
      if (def?.type === 'FILE' || def?.type === 'MULTI_FILE' || def?.type === 'PASSPORT' || def?.type === 'NATIONAL_ID' || def?.type === 'RESIDENCE_ID') return;
      safeData[key] = value;
    });
    return { record:{...record,status:record.status}, data:safeData, savedAt:nowISO() };
  },[record,normalized]);

  useEffect(()=>{
    try {
      localStorage.setItem('contract-engine-draft', JSON.stringify(localDraft));
      setSaveState('guardado sin PII sensible');
    } catch (e) {
      setSaveState('no disponible');
    }
  },[localDraft]);

  const update = (id,value)=>{
    setSaveState('guardando');
    setData(prev=>({...prev,[id]:value}));
    setRecord(prev=>({
      ...prev,
      updatedAt:nowISO(),
      dataVersion:prev.dataVersion+1
    }));
    addAudit('fieldChanged',{fieldId:id});
  };

  const extractPassport = (doc)=>{
    const next = {
      ...doc,
      extractionStatus:'NEEDS_REVIEW',
      extracted:{
        fullName: normalized.workerFullName || '',
        nationality: normalized.workerNationality || '',
        dateOfBirth: normalized.workerDateOfBirth || '',
        expiryDate:''
      }
    };
    update('workerPassport',next);
    addAudit('documentRead',{documentId:doc.id,extractionStatus:'NEEDS_REVIEW'});
  };

  const proceedReview = async ()=>{
    if (!validation.isValid) {
      setRecord(prev=>({...prev,status:RECORD_STATES.REVIEW_REQUIRED}));
      setView('form');
      return;
    }
    const canonical = safeStringify({
      recordId:record.id,
      schemaVersion:record.schemaVersion,
      dataVersion:record.dataVersion,
      data:normalized,
      documents:attachedDocs.map(d=>({
        id:d.id,name:d.name,type:d.type,size:d.size,hash:d.hash,version:d.version
      }))
    });
    const h = await sha256(canonical);
    setHash(h);
    setRecord(prev=>({...prev,status:RECORD_STATES.READY_FOR_REVIEW}));
    addAudit('reviewStarted',{contentHash:h});
    setView('review');
  };

  const beginSigning = ()=>{
    setRecord(prev=>({...prev,status:RECORD_STATES.CONSENT_PENDING}));
    setView('consent');
  };

  const confirmConsent = ()=>{
    if (!data.consentIdentity || !data.consentDocuments || !data.consentContract) return;
    setRecord(prev=>({...prev,status:RECORD_STATES.AUTH_REQUIRED}));
    addAudit('consentsConfirmed');
    setView('auth');
  };

  const authenticate = async ()=>{
    const secure = window.isSecureContext === true;
    const webAuthnAvailable = !!window.PublicKeyCredential && secure;
    addAudit('authenticationCapabilityChecked',{secureContext:secure,webAuthnAvailable,mode:AUTH_MODE});
    setRecord(prev=>({...prev,status:RECORD_STATES.SIGNATURE_PENDING}));
    setView('signature');
  };

  const sign = async ()=>{
    if (!hash || !validation.isValid) return;
    const signedAt = nowISO();
    const signaturePayload = {
      recordId:record.id,
      version:record.version,
      hash,
      signerRole:role,
      signedAt,
      authMode:AUTH_MODE
    };
    const signatureId = await sha256(safeStringify(signaturePayload));
    const receipt = {...signaturePayload,signatureId:signatureId.slice(0,64),verificationId:generateId('VRF')};
    receipt.verificationUrl = buildVerificationUrl(receipt);
    setSignatureReceipt(receipt);
    setRecord(prev=>({
      ...prev,
      status:RECORD_STATES.ACTIVE,
      updatedAt:signedAt,
      version:prev.version+1
    }));
    addAudit('demoReceiptCreated',{signatureId:receipt.signatureId,verificationUrl:receipt.verificationUrl});
    setView('success');
  };

  const reset = ()=>{
    localStorage.removeItem('contract-engine-draft');
    documents.forEach(d=>{try{URL.revokeObjectURL(d.url)}catch{}});
    setDocuments([]);
    setData({workerRole:'worker',country:'SA',city:'Jeddah',jurisdiction:'Jeddah, Saudi Arabia',compensation:'paid',currency:'SAR'});
    setDocuments([]);
    setView('form');
    setHash('');
    setSignatureReceipt(null);
    setAudit([]);
    setRecord({...record,id:generateId('CR'),version:1,dataVersion:1,status:RECORD_STATES.DRAFT,createdAt:nowISO()});
  };

  const workerPreviewData = {
    name: normalized.workerFullName || '—',
    nationality: getCountry(normalized.workerNationality)?.label || '—',
    email: normalized.workerEmail || '—',
    phone: normalized.workerPhone || '—',
    position: normalized.position || '—',
    startDate: normalized.startDate || '—'
  };

  return (
    <div className="min-h-full">
      <div className="max-w-3xl mx-auto px-4 py-5 sm:py-8 space-y-4">
        {/* No header. Only compact utility row. */}
        <div className="flex items-center justify-between gap-3">
          {view !== 'form' && (
            <button className="tap inline-flex items-center gap-2 text-sm font-semibold text-gray-600 dark:text-gray-300" onClick={()=>setView(view==='review'?'form':view==='consent'?'review':view==='auth'?'consent':view==='signature'?'auth':'form')}>
              <Icon name="arrowLeft" size={17}/> Atrás

          )}
          <div className="ml-auto flex items-center gap-2">
            <Badge tone={record.status===RECORD_STATES.ACTIVE?'green':validation.errors.length?'red':'blue'}>
              {record.status}

            <button className="tap w-10 h-10 rounded-xl bg-black/5 dark:bg-white/10 flex items-center justify-center" onClick={()=>setDark(v=>!v)} aria-label="Cambiar tema">
              <Icon name={dark?'sun':'moon'} size={17}/>
            </button>
          </div>
        </div>

        {view==='form' && (
          <>
            <div className="animate-up space-y-2">
              <div className="text-2xl sm:text-3xl font-bold tracking-tight">¿Qué deseas completar?</div>
              <p className="text-sm text-gray-500">Registro contractual de trabajo doméstico o asistencia personal, con datos introducidos y revisados por las partes.</p>
            </div>

            <GlassCard className="space-y-4">
              <Progress pct={pct}/>
              <div className="flex flex-wrap gap-2">

                <Badge tone={validation.errors.length?'red':'green'}>{validation.errors.length} errores</Badge>

              </div>
            </GlassCard>

            {Object.entries(grouped).map(([section,fields])=>(
              <GlassCard key={section} className="space-y-5 animate-up">
                <div className="flex items-center justify-between gap-3">
                  <div>
                    <div className="text-[10px] font-mono tracking-widest text-gray-400">{section}</div>

              </div>
              <div className="grid sm:grid-cols-2 gap-3 text-xs">
                <div className="p-3 rounded-2xl bg-black/5 dark:bg-white/5"><div className="text-gray-500">Expediente</div><div className="font-semibold mt-1">{record.id}</div></div>
                <div className="p-3 rounded-2xl bg-black/5 dark:bg-white/5"><div className="text-gray-500">Versión</div><div className="font-semibold mt-1">{record.version}</div></div>
              </div>
              <button className="w-full tap rounded-2xl py-4 bg-apple-green text-white font-bold" onClick={sign}>Firmar y generar recibo</button>
              <div className="text-[10px] text-gray-400">Este prototipo genera un recibo criptográfico de demostración. En producción debe conectarse un proveedor de firma electrónica adecuado.</div>
            </GlassCard>
          </div>
        )}

        {view==='success' && signatureReceipt && (
          <div className="space-y-4 animate-up">
            <div className="text-center py-3">
              <div className="mx-auto w-20 h-20 rounded-full bg-apple-green text-white flex items-center justify-center"><Icon name="check" size={38}/></div>
              <h1 className="text-2xl font-bold mt-4">Expediente activo</h1>
              <p className="text-sm text-gray-500 mt-1">La versión se identifica por su hash y un recibo local. La verificación pública solo muestra los datos transportados por el QR.</p>
            </div>

            <GlassCard className="space-y-4">
              <div className="flex items-center justify-between gap-3">
                <div>
                  <div className="text-[10px] text-gray-400 uppercase">Record ID</div>
                  <div className="font-mono font-semibold text-sm">{record.id}</div>
                </div>
                <Badge tone="green">ACTIVE</Badge>
              </div>
              <div className="p-4 rounded-2xl bg-gray-50 dark:bg-gray-900 space-y-2 text-xs">
                <div className="flex justify-between gap-4"><span className="text-gray-500">Version</span><span>{record.version}</span></div>
                <div className="flex justify-between gap-4"><span className="text-gray-500">Hash</span><span className="font-mono truncate max-w-[65%]">{hash}</span></div>
                <div className="flex justify-between gap-4"><span className="text-gray-500">Signature ID</span><span className="font-mono truncate max-w-[65%]">{signatureReceipt.signatureId}</span></div>
              </div>
              <div className="rounded-2xl border border-black/5 dark:border-white/10 p-4 text-center">
                <VerificationQR receipt={signatureReceipt}/>
                <div className="text-[10px] text-gray-400 mt-3">Identificador: {signatureReceipt.verificationId}</div>
              </div>
            </GlassCard>

            <GlassCard className="space-y-3">
              <div className="font-bold">Auditoría</div>
              {audit.slice(-8).reverse().map(e=><div key={e.eventId} className="flex gap-3 py-2 border-b border-black/5 dark:border-white/10 last:border-0"><div className="w-2 h-2 rounded-full bg-apple-blue mt-1.5 shrink-0"/><div><div className="text-xs font-semibold">{e.action}</div><div className="text-[10px] text-gray-500 font-mono">{new Date(e.timestamp).toLocaleString()}</div></div></div>)}
            </GlassCard>

            <button className="w-full tap rounded-2xl py-4 bg-black dark:bg-white text-white dark:text-black font-bold" onClick={reset}>Crear nuevo expediente</button>
          </div>
        )}

        {/* Expert mini-panel */}
        <details className="mt-3">
          <summary className="cursor-pointer text-xs font-semibold text-gray-500 px-1">Modo experto</summary>
          <div className="mt-3 space-y-3">
            <GlassCard>
              <div className="flex items-center justify-between mb-3">
                <div>
                  <div className="font-bold text-sm">Schema / Data / Rules / State</div>
                  <div className="text-[10px] text-gray-500">Vista de depuración local</div>
                </div>
                <Badge tone="purple">{FIELD_TYPES.length} tipos</Badge>
              </div>
              <pre className="text-[10px] leading-5 overflow-auto max-h-72 font-mono">{JSON.stringify({
                record, role,
                applicableFields:visible.map(f=>f.id),
                state:{progress:pct,errors:validation.errors,warnings:validation.warnings},
                normalized,
                schemaTypes:FIELD_TYPES
              },null,2)}</pre>
            </GlassCard>
          </div>
        </details>
      </div>

      {activeDoc && <DocumentViewer doc={activeDoc} onClose={()=>setActiveDoc(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
