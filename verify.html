<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f8"><meta name="description" content="Verificación de identificadores del expediente de alquiler."><link rel="stylesheet" href="./styles/world-ui.css"><title>Alquiler España · Verificación</title></head>
<body><main class="world-content" style="padding-top:max(24px,env(safe-area-inset-top))">
<section class="summary-card"><div class="section-head"><div><span class="eyebrow">VERIFICACIÓN</span><h1>Alquiler España</h1><span class="muted">Comprobación local del enlace</span></div><span class="pill">LOCAL</span></div>
<div id="status" class="hero-value" style="font-size:34px;margin-top:22px">Validando…</div><p id="summary" class="muted">Comprobando identificadores.</p><div id="rows"></div>
<div class="notice"><strong>Alcance:</strong> esta página comprueba el formato de los identificadores transportados. No demuestra por sí sola identidad, autenticación ni firma electrónica contra un servidor.</div>
</section></main>
<script>
const p=new URLSearchParams(location.search);
const id=p.get("id")||"",version=p.get("version")||"",hash=p.get("hash")||"",request=p.get("request")||"",policy=p.get("policy")||"";
const valid=/^[A-Z0-9-]{8,120}$/i.test(id)&&/^\d+\.\d+\.\d+$/.test(version)&&/^[a-f0-9]{64}$/i.test(hash)&&/^[A-Z0-9-]{8,120}$/i.test(request)&&/^\d{4}\.\d{2}\.\d{2}$/.test(policy);
const status=document.querySelector("#status");status.textContent=valid?"Formato válido":"Enlace incompleto";status.className="hero-value "+(valid?"pill good":"pill bad");
document.querySelector("#summary").textContent=valid?"Los identificadores tienen formato compatible con la política y versión declaradas.":"Falta información o algún identificador no tiene el formato esperado.";
for(const x of [["Contrato",id],["Versión",version],["Política",policy],["SHA-256",hash],["Request ID",request]]){const row=document.createElement("div");row.className="hash-row";const a=document.createElement("span");a.textContent=x[0];const b=document.createElement("b");b.className="break";b.textContent=x[1]||"—";row.append(a,b);document.querySelector("#rows").append(row);}
</script></body></html>
